# ============================================
# Application
# ============================================
spring.application.name=agent_vibe_rpa_v1
spring.main.banner-mode=off
spring.jpa.open-in-view=false

# Application settings
server.port=8081

# URL of the catalog service (your FastAPI)
catalog.service.url=http://localhost:8000

# LLM settings (Qwen via OpenAI-compatible API)
llm.api.url=
llm.api.key=
llm.model=

# Directory for saving generated planning results
planner.output.dir=

# ============================================
# Logging
# ============================================
logging.level.root=INFO
logging.level.org.apache.coyote=ERROR
logging.level.org.hibernate.orm.connections.pooling=WARN
logging.level.org.hibernate.engine.transaction.jta.platform=WARN
logging.pattern.console=\u001b[0;34;1m%d{HH:mm:ss} \u001b[0;32;1m%-5level \u001b[0;33;1m%logger{36} - \u001b[0;37;1m%msg%n
